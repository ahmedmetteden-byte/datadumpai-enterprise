server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product API — same-origin /api → FastAPI service
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # Hashed build assets (filename changes on every deploy, e.g.
    # index-E9edp_Ta.js) — safe to cache aggressively and immutably, since
    # a stale copy can't exist under a name whose content still matches.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # index.html (served here for every non-asset path via the SPA
        # fallback) is what points the browser at the current hashed
        # bundle, so it must always be revalidated. With no Cache-Control
        # header at all, browsers apply heuristic caching and can keep
        # serving a stale index.html — pointing at an old, already-fixed
        # bundle — after a deploy, until something forces a hard refresh.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
