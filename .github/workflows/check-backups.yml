name: Check Supabase backups

on:
  schedule:
    # Daily, offset from the hour so it doesn't pile up with other scheduled
    # jobs at :00. Supabase's own automated backups run on Supabase's
    # schedule, not this one — this only checks that they're happening.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: check-backups
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-backups:
    name: Verify backup freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run backup freshness check
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python scripts/check_supabase_backups.py

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Supabase backup check"
            echo ""
            if [ "${{ steps.check.outcome }}" = "success" ]; then
              echo "**Status: healthy** — see the \"Run backup freshness check\" step log for details."
            else
              echo "**Status: FAILED** — backups are stale, missing, or PITR is disabled."
              echo ""
              echo "See the \"Run backup freshness check\" step log for specifics, and"
              echo "\`PRODUCTION.md\` (\"Backup / restore readiness\") for the manual restore runbook."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
