services:
  frontend:
    build:
      context: ./web
      args:
        # Prefer explicit VITE_* from root .env; fall back to backend SUPABASE_*.
        # These are baked into the static bundle at build time — rebuild after changes.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-}}
        # Empty = same-origin /api nginx proxy to the api service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: datadumpai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - api

  api:
    build: .
    env_file:
      - .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    command:
      [
        "uvicorn",
        "api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - ./api:/app/api:ro
      - ./services:/app/services:ro
      - ./repositories:/app/repositories:ro
      - ./storage:/app/storage:ro
      - ./core:/app/core:ro
      - ./models:/app/models:ro
      - ./config.py:/app/config.py:ro
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: datadumpai-enterprise-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  webhooks:
    build: .
    env_file:
      - .env
    command:
      [
        "uvicorn",
        "api.webhook_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    ports:
      - "${WEBHOOK_PORT:-8001}:8001"
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  app_data:
  qdrant_data:
